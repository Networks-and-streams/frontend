# Frontend production container: serves the built SPA from /usr/share/nginx/html.
# Used inside frontend/Dockerfile (production target); this container sits behind
# the main Nginx proxy (infra/nginx/conf.d/prod.conf), which handles /api and
# external headers.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # React Router SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted assets can be cached; everything else must stay fresh.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}